services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fie
      POSTGRES_PASSWORD: fie
      POSTGRES_DB: fie
    volumes:
      - fie_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fie -d fie"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://fie:fie@db:5432/fie
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      MIN_PREDICTION_PROBABILITY: ${MIN_PREDICTION_PROBABILITY:-0.85}
      MIN_DATA_QUALITY_SCORE: ${MIN_DATA_QUALITY_SCORE:-70}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      API_FOOTBALL_KEY: ${API_FOOTBALL_KEY:-}
      FOOTBALL_DATA_ORG_KEY: ${FOOTBALL_DATA_ORG_KEY:-}
      APIFOOTBALL_COM_KEY: ${APIFOOTBALL_COM_KEY:-}
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      # Server-to-server hop; the browser only talks to this container.
      FIE_ENGINE_URL: http://backend:8000
      FIE_API_KEY: ${FIE_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  fie_pgdata:
